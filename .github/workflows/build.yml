name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write  # required to create the GitHub Release on tag pushes

jobs:
  build-apk:
    name: Build release APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show pre-installed SDK packages
        run: |
          sdkmanager --list_installed 2>/dev/null | head -40 || true
          echo "--- cmake ---"
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true
          echo "--- ndk ---"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Bun (web-ui install)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm (web-ui build)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release APKs + AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --no-daemon \
            --stacktrace
        env:
          # Sign with the keystore from secrets, or build unsigned if secrets
          # are not set (Gradle reads these via System.getenv() in
          # app/build.gradle.kts as a fallback to local.properties).
          RELEASE_STORE_FILE:     ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: List built artifacts
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) | sort
          echo "---"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true
          ls -la app/build/outputs/bundle/release/ 2>/dev/null || true

      - name: Upload universal APK
        if: hashFiles('app/build/outputs/apk/release/app-universal-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: warn

      - name: Upload arm64-v8a APK
        if: hashFiles('app/build/outputs/apk/release/app-arm64-v8a-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        if: hashFiles('app/build/outputs/apk/release/app-x86_64-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: warn

      - name: Upload AAB
        if: hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RikkaHub Agent ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
